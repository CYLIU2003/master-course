name: Research code validation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-without-gurobi:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Compile Python sources
        shell: pwsh
        run: python -m compileall -q src bff scripts tools

      - name: Run research-contract tests
        shell: pwsh
        run: |
          python -m pytest -q `
            tests/test_scenario_fleet_contract.py `
            tests/test_frontend_rolling_orchestration.py `
            tests/test_physical_event_schedule_validation.py `
            tests/test_stage2_feedback_global_deadline.py `
            tests/test_final_rolling_accounting.py `
            tests/test_research_phase3_weather_comparison.py `
            -p no:cacheprovider

      - name: Run full suite without licensed Gurobi integration
        shell: pwsh
        run: python -m pytest -q -p no:cacheprovider

      - name: Check committed patch whitespace
        shell: pwsh
        run: git diff --check HEAD^ HEAD
