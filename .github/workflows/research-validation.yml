name: Research code validation

on:
  workflow_dispatch:

jobs:
  validate-python-311:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest gurobipy==13.0.1

      - name: Fetch pinned Japanese reporting font
        shell: pwsh
        run: |
          $fontPath = Join-Path $env:RUNNER_TEMP "NotoSansJP-VF-Sans2.004.ttf"
          Invoke-WebRequest `
            -Uri "https://raw.githubusercontent.com/notofonts/noto-cjk/Sans2.004/Sans/Variable/TTF/Subset/NotoSansJP-VF.ttf" `
            -OutFile $fontPath
          $expectedHash = "f4b373b226668ee33a6e54b02823dcd2d1209f17159f777421ae8c2275160369"
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $fontPath).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "Noto Sans JP SHA-256 mismatch: $actualHash"
          }
          "THESIS_JAPANESE_FONT_PATH=$fontPath" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build deterministic PV test profiles
        shell: pwsh
        run: >-
          python scripts/build_pv_profiles.py
          --dates 2025-08-05 2025-08-10
          --overwrite

      - name: Compile Python sources
        shell: pwsh
        run: python -m compileall -q src bff scripts tools tests

      - name: Run research-contract tests
        shell: pwsh
        run: |
          python -m pytest -q `
            tests/test_scenario_fleet_contract.py `
            tests/test_frontend_rolling_orchestration.py `
            tests/test_physical_event_schedule_validation.py `
            tests/test_stage2_feedback_global_deadline.py `
            tests/test_final_rolling_accounting.py `
            tests/test_research_phase3_weather_comparison.py `
            -p no:cacheprovider

      - name: Run full suite with the restricted Gurobi test runtime
        shell: pwsh
        run: python -m pytest -q -p no:cacheprovider

      - name: Check committed patch whitespace
        shell: pwsh
        run: git diff --check HEAD^ HEAD
